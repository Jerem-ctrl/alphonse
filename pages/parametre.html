<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- On a ajouté viewport-fit=cover et interactive-widget=resizes-content : sur téléphone, la page occupe tout l'écran, encoche comprise, et se réajuste quand le clavier s'ouvre au lieu de cacher le champ de saisie. En revanche, on laisse zoomer : bloquer le zoom, c'est fermer la porte à celles et ceux qui en ont besoin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Paramètres - Alphonse</title>
    <meta name="description" content="Consultez les informations de votre compte Alphonse.">
    <link rel="icon" type="image/png" href="../assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- On a mis les scripts dans le <head> avec defer : le navigateur les télécharge pendant qu'il lit le HTML, mais attend que la page soit construite pour les lancer. Et defer garde l'ordre, ce qui nous arrange : Supabase d'abord, puis notre client, puis Auth, et enfin le script de la page. Chacun a besoin du précédent, comme des dominos. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../assets/js/spclient.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/parametre.js" defer></script>
</head>

<body>

    <!-- Menu de navigation -->
    <header>
        <nav>
            <a href="./conversation.html">Conversations</a>
            <a href="./contact.html">Contacts</a>
        </nav>
    </header>

    <main>

        <h1>Paramètres</h1>

        <!-- Informations du compte -->
        <section>
            <h2>Mon compte</h2>
            <p>Pseudo : <strong id="affichage-pseudo">…</strong></p>
            <p>Email : <strong id="affichage-email">…</strong></p>
        </section>

        <!-- Déconnexion -->
        <button type="button" id="bouton-deconnexion">Se déconnecter</button>

    </main>

    <!-- Pied de page : copyright -->
    <footer>
        <h4>© 2026-2027 Alphonse. Tous droits réservés.</h4>
    </footer>

</body>

</html>
