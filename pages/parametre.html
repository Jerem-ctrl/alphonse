<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- On a ajouté viewport-fit=cover et interactive-widget=resizes-content : sur téléphone, la page occupe tout l'écran, encoche comprise, et se réajuste quand le clavier s'ouvre au lieu de cacher le champ de saisie. En revanche, on laisse zoomer : bloquer le zoom, c'est fermer la porte à celles et ceux qui en ont besoin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Paramètres - Alphonse</title>
    <meta name="description" content="Consultez les informations de votre compte Alphonse.">
    <link rel="icon" type="image/png" href="../assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- local.js passe en premier, et sans defer : spclient.js en a besoin pour créer le client. Comme il ne touche pas au document, rien ne l'oblige à attendre que la page soit construite. -->
    <script src="../assets/js/local.js"></script>
    <!-- On a mis les scripts dans le <head> avec defer : le navigateur les télécharge pendant qu'il lit le HTML, mais attend que la page soit construite pour les lancer. Et defer garde l'ordre, ce qui nous arrange : Supabase d'abord, puis notre client, puis Auth, et enfin le script de la page. Chacun a besoin du précédent, comme des dominos. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../assets/js/spclient.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/parametre.js" defer></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/data.js" defer></script>
    <script src="../assets/js/presence.js" defer></script>
</head>

<body>

    <!-- <header> : l'en-tête commun à nos trois pages, avec le logo et la navigation principale. Même place et mêmes liens partout : personne ne devrait avoir à chercher le menu. -->
    <header>
        <!-- Le logo et le nom ramènent aux conversations, comme on s'y attend sur la plupart des sites. On laisse alt="" parce que le nom est écrit juste à côté : inutile que le lecteur d'écran dise « Alphonse » deux fois. Ce n'est pas un titre, chaque page garde son propre <h1>. -->
        <a href="conversation.html" class="marque">
            <img src="../assets/img/logo-alphonse.png" alt="" width="500" height="500">
            <span>Alphonse</span>
        </a>
        <!-- <nav> = un bloc de liens de navigation. aria-label lui donne un nom : sur la page des conversations, il le distingue du menu des salons, et ailleurs, il aide quand même les lecteurs d'écran à s'y retrouver. -->
        <nav aria-label="Navigation principale">
            <ul>
                <!-- aria-current="page" : on signale aux lecteurs d'écran la page sur laquelle on se trouve déjà. -->
                <li><a href="conversation.html">Conversations</a></li>
                <li><a href="contact.html">Contacts</a></li>
                <li><a href="parametre.html" aria-current="page">Paramètres</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Paramètres</h1>

        <!-- Informations du compte -->
        <section>
            <h2>Mon compte</h2>
            <p>Pseudo : <strong id="affichage-pseudo">…</strong></p>
            <p>Email : <strong id="affichage-email">…</strong></p>
        </section>

        <!-- Apparence : le choix est gardé dans le navigateur et appliqué sur toutes les pages par theme.js -->
        <section>
            <h2>Apparence</h2>
            <fieldset>
                <legend>Thème</legend>
                <label><input type="radio" name="theme" value="nuit"> Nuit</label>
                <label><input type="radio" name="theme" value="jour"> Jour</label>
                <label><input type="radio" name="theme" value="auto"> Comme l'appareil</label>
            </fieldset>
        </section>
        
        <!-- Déconnexion -->
        <button type="button" id="bouton-deconnexion">Se déconnecter</button>

    </main>

    <!-- Pied de page : copyright -->
    <footer>
        <p>© 2026-2027 Alphonse. Tous droits réservés.</p>
    </footer>

</body>

</html>
