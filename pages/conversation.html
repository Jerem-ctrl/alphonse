<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- On a ajouté viewport-fit=cover et interactive-widget=resizes-content : sur téléphone, la page occupe tout l'écran, encoche comprise, et se réajuste quand le clavier s'ouvre au lieu de cacher le champ de saisie. En revanche, on laisse zoomer : bloquer le zoom, c'est fermer la porte à celles et ceux qui en ont besoin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Conversation - Alphonse</title>
    <meta name="description" content="Retrouvez vos conversations et échangez des messages sur Alphonse.">
    <link rel="icon" type="image/png" href="../assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/conversation.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../assets/js/spclient.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
    <script src="../assets/js/data.js" defer></script>
</head>

<body>

    <!-- Le lien d'évitement : les personnes qui naviguent au clavier (touche Tab) sautent directement au fil des messages, sans repasser par tout le menu. Un raccourci, en somme. -->
    <a href="#fil-messages" class="lien-evitement">Aller à la conversation</a>

    <!-- <header> : l'en-tête commun à nos trois pages, avec le logo et la navigation principale. Même place et mêmes liens partout : personne ne devrait avoir à chercher le menu. -->
    <header>
        <!-- Le logo et le nom ramènent aux conversations, comme on s'y attend sur la plupart des sites. On laisse alt="" parce que le nom est écrit juste à côté : inutile que le lecteur d'écran dise « Alphonse » deux fois. Ce n'est pas un titre, chaque page garde son propre <h1>. -->
        <a href="conversation.html" class="marque">
            <img src="../assets/img/logo-alphonse.png" alt="" width="500" height="500">
            <span>Alphonse</span>
        </a>
        <!-- <nav> = un bloc de liens de navigation. aria-label lui donne un nom : sur la page des conversations, il le distingue du menu des salons, et ailleurs, il aide quand même les lecteurs d'écran à s'y retrouver. -->
        <nav aria-label="Navigation principale">
            <ul>
                <!-- aria-current="page" : on signale aux lecteurs d'écran la page sur laquelle on se trouve déjà. -->
                <li><a href="conversation.html" aria-current="page">Conversations</a></li>
                <li><a href="contact.html">Contacts</a></li>
                <li><a href="parametre.html">Paramètres</a></li>
            </ul>
        </nav>
    </header>

    <!-- <aside> pour les salons : on a jugé que c'était du contenu complémentaire à la conversation, toujours là sur le côté, mais pas le cœur de la page. -->
    <aside aria-labelledby="titre-salons">
        <h2 id="titre-salons">Salons</h2>

        <!-- On crée un salon sans changer de page. maxlength="40" et required évitent les noms vides ou interminables ; on revérifiera quand même côté Supabase, parce qu'un navigateur, ça se contourne. -->
        <form id="formulaire-salon">
            <label for="nom-salon">Nom du nouveau salon</label>
            <input type="text" id="nom-salon" name="nom" maxlength="40" autocomplete="off" required>
            <button type="submit">Créer le salon</button>
        </form>

        <!-- La liste reste vide : c'est JavaScript qui la remplit. Chaque salon y devient un lien conversation.html?salon=…, une seule page pour tous les salons. Pratique, et pas de copier-coller ! -->
        <nav aria-label="Salons">
            <ul id="liste-salons"></ul>
        </nav>
    </aside>

    <!-- <main> = le cœur de notre page. Une messagerie sans conversation, c'est un peu comme une table sans chaise. Le <h1> affiche le nom du salon ouvert ; en attendant, on invite à en choisir un. -->
    <main>
        <h1 id="titre-salon">Choisissez un salon</h1>

        <!-- role="log" : on dit aux lecteurs d'écran que de nouveaux messages vont s'ajouter au fil, et qu'il faut les annoncer. tabindex="-1" permet au lien d'évitement d'y poser le focus. Chaque message y sera un <article>. -->
        <div id="fil-messages" role="log" aria-labelledby="titre-salon" tabindex="-1"></div>

        <!-- La petite zone « en train d'écrire… » : cachée avec hidden tant que personne ne tape. On n'en fait pas une zone annoncée, sinon le lecteur d'écran parlerait à chaque frappe, et ça deviendrait vite pénible. -->
        <p id="en-train-ecrire" hidden></p>

        <!-- role="alert" : on annonce les erreurs tout de suite aux lecteurs d'écran. Le paragraphe reste vide tant que tout va bien (et on espère qu'il le restera longtemps). -->
        <p id="erreur-conversation" role="alert"></p>

        <!-- L'emplacement de l'assistant, qui aidera à relire nos messages avant l'envoi. Il n'a encore rien à dire, mais on lui garde sa place. -->
        <section id="assistant" aria-labelledby="titre-assistant">
            <h2 id="titre-assistant">Assistant de rédaction</h2>
        </section>

        <!-- Pas d'action ni de method sur le formulaire : c'est JavaScript qui enverra le message à Supabase. Un <textarea> plutôt qu'un input, parce qu'un message pro tient rarement sur une ligne. accept="image/*" filtre les fichiers proposés, sans remplacer une vraie vérification côté service. -->
        <form id="formulaire-message">
            <label for="message">Votre message</label>
            <textarea id="message" name="message" rows="3" maxlength="2000" required></textarea>

            <label for="image">Joindre une image (facultatif)</label>
            <input type="file" id="image" name="image" accept="image/*">

            <button type="submit">Envoyer</button>
        </form>
    </main>

    <!-- Pied de page : copyright -->
    <footer>
        <p>© 2026-2027 Alphonse. Tous droits réservés.</p>
    </footer>

</body>

</html>
