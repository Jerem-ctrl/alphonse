<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- On a ajouté viewport-fit=cover et interactive-widget=resizes-content : sur téléphone, la page occupe tout l'écran, encoche comprise, et se réajuste quand le clavier s'ouvre au lieu de cacher le champ de saisie. En revanche, on laisse zoomer : bloquer le zoom, c'est fermer la porte à celles et ceux qui en ont besoin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Conversation - Alphonse</title>
    <meta name="description" content="Retrouvez vos conversations et échangez des messages sur Alphonse.">
    <link rel="icon" type="image/png" href="../assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>

        <!-- Section pour les liens principaux -->
        <nav>
            <ul>
                <li><a href="./contact.html">Contact</a></li>
                <li><a href="./parametre.html">Paramètre</a></li>
                <li><button type="button">Nouvelle conversation</button></li>
            </ul>
        </nav>

    </header>

    <main>

        <!-- Liste des conversations -->
        <div id="liste-conversations">
            <h2>Conversations</h2>
            <ul>
                <li><a href="#">Alice</a></li>
                <li><a href="#">Bob</a></li>
            </ul>
        </div>

        <!-- Liste des invitations et des contacts -->
        <div id="liste-invitations">
            <h2>Invitations et contacts</h2>
            <ul>
                <li><a href="#">Invitations reçues</a></li>
                <li><a href="#">Invitations envoyées</a></li>
                <li><a href="#">Contacts</a></li>
            </ul>
        </div>

        <!-- Zone d'affichage des messages -->
        <div id="messages">
            
        </div>

        <!-- Formulaire d'envoi de message -->
        <form id="message-form">
            <label for="message">Votre message</label>
            <input type="text" id="message" name="message" required>
            <button type="submit">Envoyer</button>
        </form>

    </main>

    <!-- Pied de page : copyright -->
    <footer>
        <h4>© 2026-2027 Alphonse. Tous droits réservés.</h4>
    </footer>

</body>

</html>
