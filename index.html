<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!--
        La politique de sécurité du contenu (CSP) : la liste des seules sources que le navigateur accepte pour cette page.
        - script-src : nos fichiers et supabase-js sur jsDelivr, rien d'autre ; aucun script écrit dans la page, aucun attribut onclick :
          un script injecté (par un message piégé, par exemple) serait bloqué même s'il arrivait dans le document.
        - connect-src : les seuls serveurs que la page peut appeler sont Supabase (https et wss pour le temps réel) et LanguageTool.
        - img-src : nos images, et celles du stockage Supabase (data: et blob: pour l'aperçu d'un fichier choisi).
        - object-src 'none', base-uri et form-action 'self' : pas de plugin, pas de détournement des liens ni des formulaires.
        GitHub Pages ne permet pas d'envoyer d'en-têtes HTTP : la politique est donc donnée dans cette balise <meta>, placée tout en haut,
        avant le premier script.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; media-src 'self'; img-src 'self' data: blob: https://nsncedqaecfkgijeulyz.supabase.co; connect-src 'self' https://nsncedqaecfkgijeulyz.supabase.co wss://nsncedqaecfkgijeulyz.supabase.co https://api.languagetool.org; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <!--
        viewport-fit=cover et interactive-widget=resizes-content permettent à la page d'occuper tout l'écran sur téléphone, encoche comprise,
        et de se réajuster à l'ouverture du clavier au lieu de masquer le champ de saisie. Le zoom reste autorisé, car le bloquer pénaliserait les personnes qui en ont besoin.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Connexion - Alphonse</title>
    <meta name="description" content="Connectez-vous ou créez un compte pour discuter sur Alphonse.">
    <link rel="icon" type="image/png" href="./assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="./assets/css/style.css">
    <!--
        local.js est chargé en premier et sans defer, car spclient.js en a besoin pour créer le client.
        Il ne modifie pas la page et n'a donc pas besoin d'attendre sa construction.
    -->
    <script src="./assets/js/local.js"></script>
    <!--
        Les scripts sont placés dans le <head> avec l'attribut defer. Le navigateur les télécharge pendant la lecture du HTML
        et ne les exécute qu'une fois la page construite, dans l'ordre d'écriture.
        Cet ordre est nécessaire, car chaque script utilise le précédent (Supabase, puis le client, puis Auth, puis le script de la page).
    -->
    <!-- supabase-js, figé à une version précise (2.118.0). integrity donne l'empreinte attendue du fichier : si jsDelivr servait un fichier modifié,
         le navigateur refuserait de l'exécuter. crossorigin="anonymous" est nécessaire pour que cette vérification soit possible. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous" defer></script>
    <script src="./assets/js/spclient.js" defer></script>
    <script src="./assets/js/auth.js" defer></script>
    <script src="./assets/js/connexion.js" defer></script>
    <script src="./assets/js/theme.js"></script>
</head>

<body>

    <!-- Formulaire de connexion -->
    <main>

        <!-- Titre de la page, placé hors du formulaire car il présente l'ensemble de la page et pas seulement les champs de connexion -->
        <div id="title-form">
            <!--
                Les images en <picture> : le navigateur prend le WebP (bien plus léger) s'il le connaît, sinon le PNG de l'<img>.
                srcset propose plusieurs largeurs du même fichier, et sizes dit la largeur affichée : le navigateur télécharge la plus petite qui suffit
                à l'écran (et à sa densité de pixels), au lieu de l'image de 1500 px pour un téléphone.
            -->
            <picture>
                <source type="image/webp" srcset="./assets/img/logo-alphonse-128.webp 128w, ./assets/img/logo-alphonse-256.webp 256w, ./assets/img/logo-alphonse-500.webp 500w" sizes="4rem">
                <img src="./assets/img/logo-alphonse.png" alt="" width="500" height="500" class="logo">
            </picture>
            <!--
                Deux versions de la bannière, une par thème, dont style.css n'affiche que la version correspondante.
                Le même texte alternatif est utilisé, puisqu'une seule bannière est visible et lue à la fois.
            -->
            <!-- fetchpriority="high" sur la bannière du thème par défaut : c'est la plus grande image visible au chargement, le navigateur la demande en premier. -->
            <picture>
                <source type="image/webp" srcset="./assets/img/banniere-alphonse-nuit-750.webp 750w, ./assets/img/banniere-alphonse-nuit-1500.webp 1500w" sizes="(min-width: 30rem) 28rem, calc(100vw - 2rem)">
                <img src="./assets/img/banniere-alphonse-nuit.png" alt="Alphonse" width="1500" height="600" class="banniere banniere-nuit" fetchpriority="high">
            </picture>
            <picture>
                <source type="image/webp" srcset="./assets/img/banniere-alphonse-jour-750.webp 750w, ./assets/img/banniere-alphonse-jour-1500.webp 1500w" sizes="(min-width: 30rem) 28rem, calc(100vw - 2rem)">
                <img src="./assets/img/banniere-alphonse-jour.png" alt="Alphonse" width="1500" height="600" class="banniere banniere-jour">
            </picture>
            <h1>Connexion</h1>
        </div>

        <form id="login-form">

            <!-- Champs regroupés dans un fieldset, dont la légende est annoncée par les lecteurs d'écran avant le premier champ -->
            <fieldset>
                <legend>Vos identifiants</legend>

                <!--
                    Champ courriel. Le pattern reprend le filtre d'adresses de Supabase, qui n'accepte que @uqac.ca et @etu.uqac.ca.
                    La personne est ainsi prévenue dès la saisie, sans attendre le refus du serveur.
                -->
                <div id="email-form">
                    <label for="email">Adresse courriel</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="jdupont12@etu.uqac.ca" pattern=".+@(etu\.)?uqac\.ca" title="Adresse de l'UQAC uniquement : elle se termine par @uqac.ca ou @etu.uqac.ca" aria-describedby="message-courriel">
                    <!-- Paragraphe rempli par connexion.js. aria-describedby le relie au champ, afin qu'un lecteur d'écran lise le message avec le champ. -->
                    <p id="message-courriel"></p>
                </div>

                <!--
                    Champ mot de passe, volontairement sans minlength ni pattern. Les comptes créés avant le réglage actuel peuvent avoir
                    un mot de passe plus court, et c'est Supabase qui valide le mot de passe.
                -->
                <div id="mdp-form">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" aria-describedby="message-mot-de-passe">
                    <p id="message-mot-de-passe"></p>
                </div>
            </fieldset>

            <!--
                Case « Se souvenir de moi », décochée par défaut. Sur un poste partagé, la session doit disparaître avec l'onglet,
                et la case n'est à cocher que sur un appareil personnel.
            -->
            <div id="remember-form">
                <input type="checkbox" name="se-souvenir" id="se-souvenir" value="oui">
                <label for="se-souvenir">Se souvenir de moi</label>
            </div>

            <!-- Zone d'erreur de la connexion. role="alert" fait annoncer le message immédiatement par les lecteurs d'écran. -->
            <p id="message-erreur" role="alert"></p>

            <!-- Bouton de connexion -->
            <div id="button-login">
                <button type="submit">Se connecter</button>
            </div>

            <!-- Ouverture de la fenêtre d'inscription -->
            <p id="button-register">
                Pas encore de compte ?
                <button type="button" id="ouvrir-inscription">Créer un compte</button>
            </p>

        </form>

    </main>

    <!-- Fenêtre d'inscription (pop-up) -->
    <dialog id="dialog-inscription">

        <form id="signup-form">

            <!-- Bouton de fermeture -->
            <button type="button" id="fermer-inscription" aria-label="Fermer">✕</button>

            <h2>Créer un compte</h2>

            <!-- Comme pour la connexion, un fieldset permet d'annoncer la légende du groupe avant le premier champ. -->
            <fieldset>
                <legend>Vos informations</legend>

                <!--
                    Champ pseudo, de 3 à 20 caractères parmi les lettres sans accent, les chiffres, _ et -.
                    L'aide reste affichée sous le champ, et aria-describedby la fait lire par les lecteurs d'écran.
                -->
                <div>
                    <label for="signup-pseudo">Pseudo</label>
                    <input type="text" id="signup-pseudo" name="pseudo" minlength="3" maxlength="20" required autocomplete="nickname" placeholder="Ex. : alpha_42" pattern="[A-Za-z0-9_\-]{3,20}" title="De 3 à 20 caractères : lettres sans accent, chiffres, _ ou -" aria-describedby="aide-pseudo message-pseudo-inscription">
                    <small id="aide-pseudo">3 à 20 caractères : lettres sans accent, chiffres, _ ou -</small>
                    <!-- Comme pour la connexion, chaque champ possède son paragraphe de message, lu après l'aide grâce à aria-describedby. -->
                    <p id="message-pseudo-inscription"></p>
                </div>

                <!-- Champ courriel, avec le même pattern qu'à la connexion, calqué sur le filtre de Supabase -->
                <div>
                    <label for="signup-email">Adresse courriel UQAC</label>
                    <input type="email" id="signup-email" name="email" required autocomplete="email" placeholder="jdupont12@etu.uqac.ca" pattern=".+@(etu\.)?uqac\.ca" title="Adresse de l'UQAC uniquement : elle se termine par @uqac.ca ou @etu.uqac.ca" aria-describedby="message-courriel-inscription">
                    <p id="message-courriel-inscription"></p>
                </div>

                <!--
                    Champ mot de passe, avec au moins 8 caractères dont une lettre et un chiffre, comme dans Supabase Auth.
                    Des règles identiques côté navigateur et côté serveur évitent des refus incompréhensibles.
                    Le pattern reste un confort de saisie, et Supabase garde le dernier mot.
                -->
                <div>
                    <label for="signup-password">Mot de passe</label>
                    <input type="password" id="signup-password" name="password" minlength="8" required autocomplete="new-password" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Au moins 8 caractères, dont une lettre et un chiffre" aria-describedby="aide-mot-de-passe message-mot-de-passe-inscription">
                    <small id="aide-mot-de-passe">8 caractères minimum, dont au moins une lettre et un chiffre</small>
                    <p id="message-mot-de-passe-inscription"></p>
                </div>
            </fieldset>

            <!-- Zone d'erreur de l'inscription, avec role="alert" pour la même raison qu'à la connexion -->
            <p id="message-erreur-inscription" role="alert"></p>

            <button type="submit">S'inscrire</button>

        </form>

    </dialog>

    <!-- Pied de page -->
    <footer>
        <p>© 2026-2027 Alphonse. Tous droits réservés.</p>
    </footer>

</body>

</html>
