<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <!-- On a ajouté viewport-fit=cover et interactive-widget=resizes-content : sur téléphone, la page occupe tout l'écran, encoche comprise, et se réajuste quand le clavier s'ouvre au lieu de cacher le champ de saisie. En revanche, on laisse zoomer : bloquer le zoom, c'est fermer la porte à celles et ceux qui en ont besoin. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Connexion - Alphonse</title>
    <meta name="description" content="Connectez-vous ou créez un compte pour discuter sur Alphonse.">
    <link rel="icon" type="image/png" href="./assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- On a mis les scripts dans le <head> avec defer : le navigateur les télécharge pendant qu'il lit le HTML, mais attend que la page soit construite pour les lancer. Et defer garde l'ordre, ce qui nous arrange : Supabase d'abord, puis notre client, puis Auth, et enfin le script de la page. Chacun a besoin du précédent, comme des dominos. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./assets/js/spclient.js" defer></script>
    <script src="./assets/js/auth.js" defer></script>
    <script src="./assets/js/connexion.js" defer></script>
</head>

<body>

    <!-- Formulaire de connexion -->
    <main>

        <form id="login-form">

            <!-- Titre de l'application web -->
            <div id="title-form">
                <img src="./assets/img/logo-alphonse.png" alt="" width="500" height="500" class="logo">
                <img src="./assets/img/banniere-alphonse.png" alt="Alphonse" width="1500" height="600" class="banniere" fetchpriority="high">
                <h1>Connexion</h1>
            </div>

            <!-- Champ email -->
            <div id="email-form">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Champ mot de passe -->
            <div id="mdp-form">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- Se souvenir de moi -->
            <div id="remember-form">
                <input type="checkbox" name="choix" id="mon-choix" value="oui">
                <label for="mon-choix">Se souvenir de moi</label>
            </div>

            <!-- Zone d'erreur de la connexion -->
            <p id="message-erreur" aria-live="polite"></p>

            <!-- Bouton de connexion -->
            <div id="button-login">
                <button type="submit">Se connecter</button>
            </div>

            <!-- Ouverture de la fenêtre d'inscription -->
            <p id="button-register">
                Pas encore de compte ?
                <button type="button" id="ouvrir-inscription">Créer un compte</button>
            </p>

        </form>

    </main>

    <!-- Fenêtre d'inscription (pop-up) -->
    <dialog id="dialog-inscription">

        <form id="signup-form">

            <!-- Bouton de fermeture -->
            <button type="button" id="fermer-inscription" aria-label="Fermer">✕</button>

            <h2>Créer un compte</h2>

            <!-- Champ pseudo -->
            <div>
                <label for="signup-pseudo">Pseudo</label>
                <input type="text" id="signup-pseudo" name="pseudo" minlength="3" maxlength="20" required>
            </div>

            <!-- Champ email -->
            <div>
                <label for="signup-email">Adresse email UQAC</label>
                <input type="email" id="signup-email" name="email" required>
            </div>

            <!-- Champ mot de passe : 6 caractères minimum -->
            <div>
                <label for="signup-password">Mot de passe</label>
                <input type="password" id="signup-password" name="password" minlength="6" required>
            </div>

            <!-- Zone d'erreur de l'inscription -->
            <p id="message-erreur-inscription" aria-live="polite"></p>

            <button type="submit">S'inscrire</button>

        </form>

    </dialog>

    <!-- Pied de page : copyright -->
    <footer>
        <p>© 2026-2027 Alphonse. Tous droits réservés.</p>
    </footer>

</body>

</html>
