<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/img/logo-alphonse.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Connexion - Alphonse</title>
</head>

<body>

    <!-- Formulaire de connexion -->
    <main>

        <form id="login-form">

            <!-- Titre de l'application web -->
            <div id="title-form">
                <img src="" alt="" class="">
                <img src="" alt="" class="">
                <h1>Connexion</h1>
            </div>

            <!-- Champ email -->
            <div id="email-form">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Champ mot de passe -->
            <div id="mdp-form">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- Se souvenir de moi -->
            <div id="remember-form">
                <input type="checkbox" name="choix" id="mon-choix" value="oui">
                <label for="mon-choix">Se souvenir de moi</label>
            </div>

            <!-- Zone d'erreur de la connexion -->
            <p id="message-erreur" aria-live="polite"></p>

            <!-- Bouton de connexion -->
            <div id="button-login">
                <button type="submit">Se connecter</button>
            </div>

            <!-- Ouverture de la fenêtre d'inscription -->
            <p id="button-register">
                Pas encore de compte ?
                <button type="button" id="ouvrir-inscription">Créer un compte</button>
            </p>

            <a href="./pages/mdp.html">Mot de passe oublié ?</a>

        </form>

    </main>

    <!-- Fenêtre d'inscription (pop-up) -->
    <dialog id="dialog-inscription">

        <form id="signup-form">

            <!-- Bouton de fermeture -->
            <button type="button" id="fermer-inscription" aria-label="Fermer">✕</button>

            <h2>Créer un compte</h2>

            <!-- Champ pseudo -->
            <div>
                <label for="signup-pseudo">Pseudo</label>
                <input type="text" id="signup-pseudo" name="pseudo" minlength="3" maxlength="20" required>
            </div>

            <!-- Champ email -->
            <div>
                <label for="signup-email">Adresse email UQAC</label>
                <input type="email" id="signup-email" name="email" required>
            </div>

            <!-- Champ mot de passe : 6 caractères minimum -->
            <div>
                <label for="signup-password">Mot de passe</label>
                <input type="password" id="signup-password" name="password" minlength="6" required>
            </div>

            <!-- Zone d'erreur de l'inscription -->
            <p id="message-erreur-inscription" aria-live="polite"></p>

            <button type="submit">S'inscrire</button>

        </form>

    </dialog>

    <!-- Pied de page : copyright -->
    <footer>
        <h4>© 2026-2027 Alphonse. Tous droits réservés.</h4>
    </footer>

    <!-- 1. Bibliothèque Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Connexion à notre projet -->
    <script src="./assets/js/spclient.js"></script>

    <!-- 3. Fonctions de connexion / inscription -->
    <script src="./assets/js/auth.js"></script>

    <!-- 4. Script de la page (connexion + inscription) -->
    <script src="./assets/js/connexion.js"></script>

</body>

</html>
