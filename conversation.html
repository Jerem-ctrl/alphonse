# du doctype jusqu'a </head>
<!doctype html>
<!--

=====================================================================
Cette page représentera l'écran de conversation d'Alphonse 
Projet fil-rouge 8WEB101 - UQAC, autonme 2026
Le nom du fichier est : conversation.html
Son role : Il servira de structure 
Il servira de structure HTML uniquement, sans style ni comportement.
=====================================================================
--->

<!-- lang="fr" : indique la langue de la page ci-dessous aux lecteur d'écran ainsi qu'aux navigateurs.
 Dans notre cas il s'agira du Français -->

 <html lang="fr">
    <!-- ========== EN-TETE DE NOTRE PAGE (Invisibile à l'écran) ========== -->
     <head>
        <!-- L'encodage UTF-8 nous permet ici d'afficher correctement les : é ; à ; ect... -->
         <meta charset="utf-8">

         <!-- On adapte la largeur de la page à l'écran de l'appareil.
          Pour les téléphone par exemple. -->
          <meta name="viewport" content="width=device-width, initial-scale=1">

          <!-- On affiche notre titre dans l'onglet du navigateur -->
           <title>Conversation - Alphonse</title>
           
           <!-- Un petit résumé de notre page qui pourrait être repris par les moteurs de recherche. -->
            <meta name="description" content="Messagerie proffessionnelle Alphonse : rédigez, évaluez 
            et améliorez vos messages avant de les envoyer">
            <!-- Petit lien également vers la feuille de style commune (dossier assets/css) -->
             <link rel="stylesheet" href="assets/css/style.css">
     </head>

     <!-- =========== LE CONTENU VISIBLE DE NOTRE PAGE AHAH =========== -->
      <body>
         <!-- ========== 1. EN-TETE DE NOTRE SITE ========== 
          <header> : va contenir le nom (Alphonse) et la navigation prinicpale
            de notre site web -->
            <header>
               <!-- Avec <h1> on va mettre le titre le plus important, c'est génial !-->
                  <h1>Alphonse</h1>
                  <!-- <nav> = les bloc de liens de navigation. 
                  aria-label donnera un nom à ce bloc, 
                  Étant donné que la page contiendra plusieurs « <nav> » ,
                  il nous faut donc distinguer ses dernières-->
                  <nav aria-label="Navigation principale">
                     <ul>
                        <li><a href="conversation.html">Messagerie</a></li>
                        <li><a href="profil.html">Profil et paramètres</a></li>
                        <li><a href="connexion.html">Déconnexion</a></li>
                     </ul>
                  </nav>
            </header>
      </body>
 </html>
