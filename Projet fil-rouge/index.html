<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png"  href="./images/logo-alphonse2-removebg-preview.png">
    <link rel="stylesheet" href="style.css">
    <title>Connexion</title>
</head>

<body>
    
    <!-- Formulaire de connexion -->
    <main>

        <marquee behavior="" direction=""></marquee> <!-- bouge mouvement tkt -->
        <form id="login-form">
            
            <!-- Titre de l'application WEB -->
            <div id="title-form">
                <img src="./images/logo-alphonse2.png" alt="" style="width: 5%;">
                <img src="./images/banniere-alphonse4.png" alt="" style="border: 2px, solid black; padding-top: 15px;">
            </div>

            <!-- Champ email -->
            <div id="email-form">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Champ mot de passe -->
            <div id="MDP-form">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <!-- Boutton de validation -->
            <div id="button"> 
                <button type="submit">Se connecter</button>
                <input type="checkbox" name="choix" id="mon-choix" value="oui">
                <label for="mon-choix">Se souvenir ?</label>
            </div>

            <!-- Boutton de validation et de redirection -->
            <div id="button"> 
                <button>S'inscrire ?</button>
            </div>

            <a href="./MDP.html">Mot de passe oubliée ?</a>

        </form>  
  
    </main>

</body>

<footer>
    <h4>© 2026-2027 Alphonse. Tous droits réservés.</h4s>
</footer>

</html>
